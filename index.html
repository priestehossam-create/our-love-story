<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Love Story ❤️</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #ffe0e9, #fff0f5);
  color: #8b2942;
  text-align: center;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
.card {
  background: white;
  margin: 20px;
  padding: 30px 20px;
  border-radius: 25px;
  box-shadow: 0 8px 25px #d98a9a55;
  max-width: 400px;
}
h1 { color: #e75480; }
.heart { font-size: 55px; }
button {
  background: #e75480;
  color: white;
  border: none;
  padding: 14px 22px;
  border-radius: 25px;
  font-size: 17px;
  cursor: pointer;
}
#message {
  display: none;
  font-size: 19px;
  line-height: 1.9;
  margin-top: 20px;
}
</style>
</head>
<body>
<div class="card">
  <div class="heart">❤️</div>
  <h1>Our Love Story</h1>
  <p>إنت أجمل حاجة حصلتلي في حياتي 💕</p>
  <p>كل يوم معاك حكاية حب جديدة.</p>
  <button onclick="document.getElementById('message').style.display='block'">
    دوس هنا يا حبيبي 💌
  </button>
  <div id="message">
    بحبك قد الدنيا كلها ❤️🥹
    <br>
    وإنت دايمًا هتفضل أجمل حكاية في عمري 🌹
  </div>
</div>
</body>
</html>
